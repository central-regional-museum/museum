<title>Journey of Man</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=Young+Serif&display=swap">
<style id="jm-css">
/* Layout: museum wall + placards. A wide migration map opens the visit, galleries follow in order of human arrival, each item reads like an exhibit label. */
:root{
  --wall:#edf0ed; --panel:#fbfcfa; --ink:#1a2320; --muted:#56645e; --line:#cfd8d2;
  --land:#d5dcd5; --land-hi:#bfcabf; --sea:#e4ebe8;
  --ochre:#a9471f; --ochre-soft:#f3e2d6; --ok:#2f6b4a; --ok-soft:#dcece1; --warn:#8a5a00; --warn-soft:#f5ead2;
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --g-africa:#9a4a22; --g-asia:#2f6f62; --g-oceania:#2c5f86; --g-europe:#5b4f86; --g-north-america:#3d6a32; --g-south-america:#8a3f55; --g-new-jersey:#355a5e;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --wall:#111715; --panel:#18201d; --ink:#e6ece8; --muted:#9caca5; --line:#2b3732;
  --land:#27322e; --land-hi:#36443e; --sea:#151d1a;
  --ochre:#e58a5c; --ochre-soft:#3a2419; --ok:#7cc79a; --ok-soft:#1c3226; --warn:#e3b65c; --warn-soft:#352a14; color-scheme:dark}}
:root[data-theme="dark"]{
  --wall:#111715; --panel:#18201d; --ink:#e6ece8; --muted:#9caca5; --line:#2b3732;
  --land:#27322e; --land-hi:#36443e; --sea:#151d1a;
  --ochre:#e58a5c; --ochre-soft:#3a2419; --ok:#7cc79a; --ok-soft:#1c3226; --warn:#e3b65c; --warn-soft:#352a14; color-scheme:dark}
body{background:var(--wall);color:var(--ink);font-family:var(--body);font-size:1.0625rem;line-height:1.6}
*{box-sizing:border-box}
a{color:inherit}
:focus-visible{outline:3px solid var(--ochre);outline-offset:2px;border-radius:4px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.nav{border-bottom:1px solid var(--line);background:var(--panel)}
.nav .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:1.25rem;text-decoration:none}
.chips{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;padding-block:2px}
.chip{white-space:nowrap;text-decoration:none;font-size:.875rem;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chip[aria-current="page"]{background:var(--ink);color:var(--wall);border-color:var(--ink)}
.eyebrow{font-family:var(--mono);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ochre)}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(2.4rem,6vw,4.25rem)}
h2{font-size:clamp(1.6rem,3.4vw,2.2rem)}
h3{font-size:1.3rem}
p{margin:0;max-width:65ch}
main{display:flex;flex-direction:column;gap:40px;padding-block:28px 56px}
.hero{display:grid;gap:14px}
.lede{font-size:1.2rem;color:var(--muted)}
.mapbox{background:var(--sea);border:1px solid var(--line);border-radius:14px;overflow-x:auto}
.mapbox svg{display:block;width:100%;min-width:720px;height:auto}
.map-land{fill:var(--land);stroke:var(--wall);stroke-width:1}
.map-link:hover .map-land,.map-link:focus .map-land,.map-land.hi{fill:var(--land-hi)}
.map-link{cursor:pointer}
.route{fill:none;stroke:var(--ochre);stroke-width:2.6;stroke-linecap:round;stroke-dasharray:1 7}
.traveler{fill:var(--ochre)}
.site{fill:var(--panel);stroke:var(--ochre);stroke-width:2.2}
.mlabel{font-family:var(--mono);font-size:13px;fill:var(--ink);paint-order:stroke;stroke:var(--sea);stroke-width:4px;stroke-linejoin:round}
.mlabel.date{fill:var(--ochre);font-weight:500}
.mlabel.place{font-family:var(--display);font-size:16px;fill:var(--muted)}
.map-caption{display:flex;gap:18px;flex-wrap:wrap;font-size:.875rem;color:var(--muted)}
.map-caption span{display:inline-flex;align-items:center;gap:8px}
.key-dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--ochre);background:var(--panel)}
.key-line{width:28px;border-top:3px dotted var(--ochre)}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.galleries{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.gcard{display:grid;grid-template-rows:auto 1fr auto;gap:8px;text-decoration:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;position:relative;overflow:hidden}
.gcard:hover{border-color:var(--ochre)}
.gcard .num{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.gcard .when{font-family:var(--mono);font-size:.8125rem;color:var(--ochre)}
.gcard .counts{font-size:.875rem;color:var(--muted)}
.gcard::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--gc)}
.gcard.local{background:linear-gradient(135deg,var(--panel),var(--ochre-soft))}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.icard{display:flex;flex-direction:column;text-decoration:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.icard:hover{border-color:var(--ochre)}
.icard .body{display:flex;flex-direction:column;gap:6px;padding:12px 14px 16px}
.icard .meta{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.thumb{aspect-ratio:4/3;width:100%;max-width:100%;object-fit:cover;display:block;background:var(--land)}
.ph{aspect-ratio:4/3;width:100%;display:grid;place-items:center;background:var(--gc);color:#fff;position:relative}
.ph b{font-family:var(--display);font-weight:400;font-size:3.4rem;line-height:1}
.ph small{position:absolute;bottom:10px;left:12px;font-family:var(--mono);font-size:.75rem;opacity:.85}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:999px;width:fit-content}
.pill.on{background:var(--ok-soft);color:var(--ok)}
.pill.soon{background:var(--warn-soft);color:var(--warn)}
.pill.sample{background:var(--ochre-soft);color:var(--ochre)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.crumb{font-size:.9rem;color:var(--muted)}
.crumb a{color:var(--muted)}
.ghead{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:start}
.ghead .mapbox svg{min-width:0}
.stamp{display:inline-block;font-family:var(--mono);font-size:.875rem;border:1.5px solid var(--ochre);color:var(--ochre);padding:4px 10px;border-radius:6px;width:fit-content}
.note{font-size:.9rem;color:var(--muted)}
.soonlist{display:flex;flex-direction:column;gap:8px;padding:0;margin:0;list-style:none}
.soonlist a{display:flex;justify-content:space-between;gap:12px;text-decoration:none;background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:12px 14px}
.placard{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;align-items:start}
.photo{width:100%;border-radius:12px;border:1px solid var(--line);display:block}
.label{display:flex;flex-direction:column;gap:18px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:.95rem}
.facts dt{font-family:var(--mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.facts dd{margin:0}
.box{border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.box.know{background:var(--ochre-soft)}
.box.think{border:1.5px dashed var(--ochre)}
.box h3{font-family:var(--body);font-weight:700;font-size:1rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-size:.95rem;display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:9px;border:1.5px solid var(--ink);background:var(--ink);color:var(--wall);cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.small{padding:5px 11px;font-size:.85rem}
.btn.danger{background:transparent;color:var(--ochre);border-color:var(--ochre)}
.btn:disabled{opacity:.5;cursor:default}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.qrpanel{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.qr{width:150px;height:150px;border-radius:6px;background:#fff;flex:none}
.footer{border-top:1px solid var(--line);color:var(--muted);font-size:.875rem}
.footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:18px}
/* staff */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line)}
.tab{font:inherit;background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;cursor:pointer;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--ochre)}
.tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
td.acc{font-family:var(--mono);font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
form.edit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-weight:700;font-size:.9rem}
.field .hint{font-size:.8rem;color:var(--muted)}
input[type=text],select,textarea{font:inherit;font-size:1rem;padding:9px 11px;border-radius:8px;border:1.5px solid var(--line);background:var(--wall);color:var(--ink);width:100%}
textarea{min-height:96px;resize:vertical}
.preview{max-width:220px;border-radius:8px;border:1px solid var(--line)}
.qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.qrcard{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.qrcard .qr{width:140px;height:140px}
.qrcard .meta{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.status{font-size:.9rem;padding:10px 14px;border-radius:10px;background:var(--ok-soft);color:var(--ok)}
.status.err{background:var(--warn-soft);color:var(--warn)}
.status.busy{background:var(--ochre-soft);color:var(--ochre)}
@media (max-width:760px){
  .ghead,.placard{grid-template-columns:1fr}
  form.edit{grid-template-columns:1fr}
}
.journey{background:var(--sea);border:1px solid var(--line);border-radius:14px;overflow-x:auto;display:flex;justify-content:center;padding-block:12px}
.journey svg{display:block;width:100%;max-width:760px;min-width:520px;height:auto}
.jlink{fill:none;stroke:var(--ochre);stroke-width:3;stroke-linecap:round;stroke-dasharray:1 8}
.jarrow{fill:none;stroke:var(--ochre);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.jnode rect{fill:var(--panel);stroke:var(--line);stroke-width:1.5}
.jnode:hover rect,.jnode:focus rect{stroke:var(--ochre);stroke-width:2.5}
.jnode.start rect{fill:var(--ochre-soft);stroke:var(--ochre);stroke-width:2.5}
.jnode.local rect{stroke-dasharray:6 5}
.jnode .sil path{fill:var(--land-hi);stroke:none}
.jnode.start .sil path{fill:var(--ochre)}
.jname{font-family:var(--display);font-size:21px;fill:var(--ink)}
.jname.big{font-size:32px}
.jdate{font-family:var(--mono);font-size:14px;font-weight:500;fill:var(--ochre)}
.jhow{font-family:var(--body);font-size:14px;fill:var(--muted)}
.jout{font-family:var(--display);font-size:20px;fill:var(--ochre)}
@media (prefers-reduced-motion:reduce){.traveler{display:none}}
</style>

   '<section class="hero"><div><div class="field-guide-heading"><span>THE SCHOOL MUSEUM</span><span>PLACES · PEOPLE · CONNECTIONS</span></div><span class="eyebrow">One world. A million stories.</span><h1>Journey of Man</h1><p class="lede">Every object has a place in the human story. Follow the clues across continents, meet the makers, and collect a few discoveries of your own.</p><a class="button" href="#gallery-list">Choose a gallery →</a></div><div class="hero-art"><svg viewBox="0 0 240 210" role="img" aria-label="Illustrated explorer compass"><circle cx="120" cy="105" r="76" fill="#edddc2" stroke="#bf9651" stroke-width="3"/><circle cx="120" cy="105" r="60" fill="#fffaf2" stroke="#155b56" stroke-width="2"/><path d="M120 48L138 105L120 162L102 105Z" fill="#155b56"/><path d="M63 105L120 87L177 105L120 123Z" fill="#623f65"/><circle cx="120" cy="105" r="9" fill="#dfb34e" stroke="#493d35"/><text x="120" y="34" text-anchor="middle" fill="#623f65" font-size="15">N</text><path d="M28 44l4 10 10 4-10 4-4 10-4-10-10-4 10-4M206 152l3 8 8 3-8 3-3 8-3-8-8-3 8-3" fill="#bf9651"/></svg><p>FOLLOW YOUR CURIOSITY</p></div></section>'+
   '<p class="notice">Preview collection · sample objects, not a confirmed inventory. Migration routes are simplified; dates describe selected evidence, not a complete timeline.</p>'+
   '<details class="migration-fold"><summary>Unfold the human journey · illustrated timeline</summary><p class="muted">Our species begins in Africa. These selected routes show a broad introduction, rather than every migration.</p><section class="journey">'+journeySVG()+'</section></details>'+
   '<section style="display:grid;gap:10px"><div class="section-head" style="margin-bottom:0"><h2>The same journey on a world map</h2></div><div class="mapbox">'+mapSVG()+'</div>'+
   '<div class="map-caption"><span><i class="key-dot"></i>Dates are approximate · years ago</span><span><i class="key-line"></i>Selected migration routes · simplified</span><span>Tap a continent to open its gallery.</span></div></section>'+
   '<section><div class="section-head"><h2 id="gallery-list">The galleries</h2><span class="note">A broad introduction to human migration</span></div><div class="galleries">'+
   GALLERIES.map(function(g){var on=itemsIn(g.id,"display").length,soon=itemsIn(g.id,"coming").length;
     return '<a class="gcard'+(g.local?' local':'')+'" href="#'+g.id+'" style="--gc:var(--g-'+g.id+')"><span class="num">Gallery '+g.n+'</span><div style="display:grid;gap:6px;align-content:start"><h3>'+esc(g.title)+'</h3><span class="when">'+esc(g.when)+'</span></div><span class="counts">'+on+' on display'+(soon?' · '+soon+' coming soon':'')+'</span></a>';}).join("")+
   '</div></section>'+
   (recent.length?'<section><div class="section-head"><h2>New in the museum</h2></div><div class="items">'+recent.map(itemCard).join("")+'</div></section>':'')+
  '</main>'+footer();
}
function viewGallery(g){
  var on=itemsIn(g.id,"display"),soon=itemsIn(g.id,"coming");
  return nav(g.id)+'<main class="wrap">'+
   '<div class="crumb"><a href="#">Journey of Man</a> / Gallery '+g.n+'</div>'+
   '<section class="ghead"><div style="display:grid;gap:14px"><span class="eyebrow">Gallery '+g.n+'</span><h1>'+esc(g.title)+'</h1><span class="stamp">'+esc(g.when)+'</span><p>'+esc(g.intro)+'</p></div>'+
   '<div class="mapbox">'+mapSVG({highlight:g.id,small:true,still:true})+'</div></section>'+
   '<section><div class="section-head"><h2>On display</h2><span class="note">'+on.length+' item'+(on.length===1?'':'s')+'</span></div>'+
   (on.length?'<div class="items">'+on.map(itemCard).join("")+'</div>':'<p class="note">Items for this gallery are being prepared. Check back soon!</p>')+'</section>'+
   (soon.length?'<section><div class="section-head"><h2>Coming soon</h2></div><ul class="soonlist">'+soon.map(function(it){return '<li><a href="index.html#exhibit/'+encodeURIComponent(it.id)+'"><span>'+esc(it.name)+'</span><span class="pill soon">Coming soon</span></a></li>';}).join("")+'</ul></section>':'')+
   (canEdit?'<section class="qrpanel">'+qrSVG(galleryURL(g),g.title)+'<div style="display:grid;gap:8px;min-width:0"><span class="eyebrow">Staff only</span><h3>Gallery sign QR code</h3><p class="note">Put this on the sign at the entrance to this gallery. It opens this page.</p>'+(dl?'<button class="btn small ghost" data-qr-gallery="'+g.id+'">Save QR image</button>':'')+'</div></section>':'')+
  '</main>'+footer();
}
function viewItem(it){
  var g=GMAP[it.gallery]||GALLERIES[0], list=itemsIn(g.id,"display"), idx=list.indexOf(it), prev=idx>0?list[idx-1]:null, next=idx>=0&&idx<list.length-1?list[idx+1]:null;
  var coming=it.status!=="display";
  return nav(g.id)+'<main class="wrap">'+
   '<div class="crumb"><a href="#">Journey of Man</a> / <a href="#'+g.id+'">'+esc(g.title)+'</a></div>'+
   '<section class="placard"><div>'+(it.photo?'<img class="photo" src="'+esc(it.photo)+'" alt="'+esc(it.name)+'">':photoOrTile(it,"photo"))+'</div>'+
   '<article class="label">'+pills(it)+'<div style="display:grid;gap:6px"><span class="eyebrow">'+esc(it.no)+' · Gallery '+g.n+': '+esc(g.name)+'</span><h1 style="font-size:clamp(2rem,4.4vw,3rem)">'+esc(it.name)+'</h1></div>'+
   (coming?'<p class="lede">This item is on its way to the museum. Come back soon to see it on display!</p>':'')+
   '<dl class="facts">'+(it.era?'<dt>When</dt><dd>'+esc(it.era)+'</dd>':'')+(it.origin?'<dt>From</dt><dd>'+esc(it.origin)+'</dd>':'')+(it.place&&!coming?'<dt>Find it</dt><dd>'+esc(it.place)+'</dd>':'')+'</dl>'+
   (it.description?'<p>'+esc(it.description)+'</p>':'')+
   (it.fact?'<div class="box know"><h3>Did you know?</h3><p>'+esc(it.fact)+'</p></div>':'')+
   (it.question?'<div class="box think"><h3>Think about it</h3><p>'+esc(it.question)+'</p></div>':'')+
   ('speechSynthesis' in window?'<div class="row"><button class="btn ghost" id="read-aloud">Read this to me</button></div>':'')+
   '</article></section>'+
   '<nav class="pager">'+(prev?'<a class="btn ghost" href="#item-'+prev.id+'">← '+esc(prev.name)+'</a>':'<span></span>')+(next?'<a class="btn ghost" href="#item-'+next.id+'">'+esc(next.name)+' →</a>':'<a class="btn ghost" href="#'+g.id+'">Back to '+esc(g.name)+'</a>')+'</nav>'+
   (canEdit?'<section class="qrpanel">'+qrSVG(itemURL(it),it.name)+'<div style="display:grid;gap:8px;min-width:0"><span class="eyebrow">Staff only</span><h3>This item’s QR code</h3><p class="note">The code always opens this page, so you can print it now and edit the item later.</p><div class="row">'+(dl?'<button class="btn small ghost" data-qr-item="'+it.id+'">Save QR image</button>':'')+'<button class="btn small" data-edit="'+it.id+'">Edit item</button></div></div></section>':'')+
  '</main>'+footer();
}
function viewNotFound(){ return nav("")+'<main class="wrap"><h1>We couldn’t find that item</h1><p>It may have been removed from the museum. <a href="#">Go to the museum home</a>.</p></main>'+footer(); }

/* ---------- staff ---------- */
function blankItem(){ return {id:"",no:"",gallery:"africa",name:"",era:"",origin:"",place:"",status:"coming",description:"",fact:"",question:"",photo:"",added:""}; }
function viewStaff(){
  if(!canEdit) return nav("")+'<main class="wrap"><h1>Museum staff</h1><p>'+(readOnlyReason||"Only museum staff with edit access can add or change items. Visitors can explore the galleries from the home page.")+'</p><p><a href="#">Go to the museum home</a></p></main>'+footer();
  var body;
  if(editing) body=viewForm();
  else if(staffTab==="qr") body=viewQRSheet();
  else body=viewItemTable();
  return nav("")+'<main class="wrap"><section style="display:grid;gap:10px"><span class="eyebrow">Museum staff</span><h1 style="font-size:clamp(2rem,4.4vw,3rem)">Manage exhibits</h1><p class="note">Add an item when it arrives, then switch it to “On display” when it’s placed in its case. Each item’s QR code stays the same, so printed codes keep working after edits.</p></section>'+statusBox()+
   (editing?'':'<div class="row" style="justify-content:space-between"><div class="tabs" role="tablist"><button class="tab" role="tab" aria-selected="'+(staffTab==="items")+'" data-tab="items">Items ('+data.items.length+')</button><button class="tab" role="tab" aria-selected="'+(staffTab==="qr")+'" data-tab="qr">QR codes</button></div><button class="btn" data-new="1">Add an item</button></div>')+
   body+'</main>'+footer();
}
function viewItemTable(){
  if(!data.items.length) return '<p class="note">No items yet. Choose “Add an item” to put the first one in the museum.</p>';
  var rows=data.items.slice().sort(function(a,b){var ga=GMAP[a.gallery].n,gb=GMAP[b.gallery].n;return ga-gb||(a.no<b.no?-1:1);}).map(function(it){
    var del=confirmDel===it.id?'<span class="row"><span class="note">Delete for good?</span><button class="btn small danger" data-delyes="'+it.id+'">Delete</button><button class="btn small ghost" data-delno="1">Keep</button></span>':'<button class="btn small ghost" data-del="'+it.id+'">Delete</button>';
    return '<tr><td class="acc">'+esc(it.no)+'</td><td><a href="index.html#exhibit/'+encodeURIComponent(it.id)+'">'+esc(it.name)+'</a>'+(it.sample?' <span class="pill sample">Sample</span>':'')+'</td><td>'+esc(GMAP[it.gallery].name)+'</td><td>'+(it.status==="display"?'<span class="pill on">On display</span>':'<span class="pill soon">Coming soon</span>')+'</td><td><div class="row">'+
      (it.status==="display"?'<button class="btn small ghost" data-toggle="'+it.id+'">Mark coming soon</button>':'<button class="btn small" data-toggle="'+it.id+'">Mark on display</button>')+
      '<button class="btn small ghost" data-edit="'+it.id+'">Edit</button>'+del+'</div></td></tr>';}).join("");
  var anySample=data.items.some(function(i){return i.sample;});
  return (anySample?'<p class="note">Items marked “Sample” are examples to show how the museum looks. Delete them once your real items are in.</p>':'')+
   '<div class="tablewrap"><table><thead><tr><th>No.</th><th>Item</th><th>Gallery</th><th>Status</th><th>Actions</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function viewQRSheet(){
  return '<p class="note">Take a screenshot of this page, or save each code as an image to print on labels. Gallery codes go on the sign at each gallery entrance; item codes go next to each item.</p>'+
   GALLERIES.map(function(g){var its=itemsIn(g.id);
     return '<section style="display:grid;gap:12px"><h2>'+esc(g.title)+'</h2><div class="qrgrid"><div class="qrcard">'+qrSVG(galleryURL(g),g.title)+'<strong>Gallery sign</strong><span class="meta">Gallery '+g.n+'</span>'+(dl?'<button class="btn small ghost" data-qr-gallery="'+g.id+'">Save image</button>':'')+'</div>'+
       its.map(function(it){return '<div class="qrcard">'+qrSVG(itemURL(it),it.name)+'<strong>'+esc(it.name)+'</strong><span class="meta">'+esc(it.no)+'</span>'+(dl?'<button class="btn small ghost" data-qr-item="'+it.id+'">Save image</button>':'')+'</div>';}).join("")+
     '</div></section>';}).join("");
}
function field(id,label,val,opts){opts=opts||{};
  var ctl=opts.area?'<textarea id="'+id+'" name="'+id+'">'+esc(val)+'</textarea>':'<input type="text" id="'+id+'" name="'+id+'" value="'+esc(val)+'"'+(opts.req?' required':'')+'>';
  return '<div class="field'+(opts.full?' full':'')+'"><label for="'+id+'">'+label+'</label>'+ctl+(opts.hint?'<span class="hint">'+opts.hint+'</span>':'')+'</div>';}
function viewForm(){
  var it=editing;
  return '<form class="edit" id="item-form" novalidate>'+
   '<div class="field full"><h2>'+(it.id?'Edit '+esc(it.no):'Add an item')+'</h2></div>'+
   field("f-name","Item name",it.name,{req:true,full:true,hint:"For example: Replica Spear Point"})+
   '<div class="field"><label for="f-gallery">Gallery</label><select id="f-gallery">'+GALLERIES.map(function(g){return '<option value="'+g.id+'"'+(g.id===it.gallery?' selected':'')+'>'+g.n+'. '+esc(g.title)+'</option>';}).join("")+'</select></div>'+
   '<div class="field"><label for="f-status">Status</label><select id="f-status"><option value="coming"'+(it.status!=="display"?' selected':'')+'>Coming soon (not placed yet)</option><option value="display"'+(it.status==="display"?' selected':'')+'>On display</option></select></div>'+
   field("f-era","When is it from?",it.era,{hint:"For example: About 17,000 years ago, or 1920s"})+
   field("f-origin","Where is it from?",it.origin,{hint:"For example: Lascaux Cave, France"})+
   field("f-place","Where to find it in the museum",it.place,{hint:"For example: Case 3, top shelf"})+
   '<div class="field"><label for="f-photo">Photo</label><input type="file" id="f-photo" accept="image/*"><span class="hint">'+(photoWork?esc(photoWork):'JPG or PNG. It’s resized automatically.')+'</span>'+(it.photo?'<img class="preview" src="'+esc(it.photo)+'" alt="Photo preview"><button type="button" class="btn small ghost" data-rmphoto="1" style="width:fit-content">Remove photo</button>':'')+'</div>'+
   field("f-desc","Description for kids",it.description,{area:true,full:true,hint:"Two to four short sentences: what it is and why it matters."})+
   field("f-fact","Did you know?",it.fact,{area:true,hint:"One surprising fact."})+
   field("f-question","Think about it",it.question,{area:true,hint:"A question for visitors to wonder about."})+
   '<div class="field full"><div class="row"><button class="btn" type="submit">'+(it.id?'Save changes':'Add to museum')+'</button><button class="btn ghost" type="button" data-cancel="1">Cancel</button></div></div>'+
  '</form>';
}
function readForm(){
  var g=function(id){var el=document.getElementById(id);return el?el.value.trim():"";};
  editing.name=g("f-name");editing.gallery=g("f-gallery")||"africa";editing.status=g("f-status")==="display"?"display":"coming";
  editing.era=g("f-era");editing.origin=g("f-origin");editing.place=g("f-place");editing.description=g("f-desc");editing.fact=g("f-fact");editing.question=g("f-question");
}
function readPhoto(file){return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){var img=new Image();img.onload=function(){var max=1000,w=img.naturalWidth,h=img.naturalHeight,s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);var c=document.createElement("canvas");c.width=w;c.height=h;var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);res(c.toDataURL("image/jpeg",0.78));};img.onerror=rej;img.src=fr.result;};fr.onerror=rej;fr.readAsDataURL(file);});}

function buildDoc(d){
  var css=document.getElementById("jm-css").textContent, main=document.getElementById("jm-main").textContent;
  var json=JSON.stringify(d).replace(/</g,"\\u003c");
  return SKELETON_OPEN+PAGE_TOP+'<style id="jm-css">'+css+'</style>\n<div id="app"></div>\n<script type="application/json" id="jm-data">'+json+'<\/script>\n'+QR_TAG+'\n<script id="jm-main">'+main+'<\/script>'+SKELETON_CLOSE;
}
function save(next,okText){
  if(!art){statusMsg={kind:"err",text:"Saving isn’t available in this view."};render();return;}
  statusMsg={kind:"busy",text:"Saving…"};render();
  try{sessionStorage.setItem("jm-flash",okText);}catch(e){}
  art.publish(buildDoc(next)).then(function(){ data=next; editing=null; statusMsg={kind:"ok",text:okText}; render(); })
  .catch(function(err){
    try{sessionStorage.removeItem("jm-flash");}catch(e){}
    var code=err&&err.code;
    if(code==="conflict") statusMsg={kind:"err",text:"Someone else saved at the same moment. The page is reloading with their version, so please make your change again."};
    else if(code==="not_writer"||code==="not_granted"||code==="not_declared"||code==="consent_required"||code==="capability_disabled"||code==="capability_removed"){canEdit=false;readOnlyReason="This view is read-only, so changes can’t be saved here. Open the museum from your own Claude account to edit it.";statusMsg=null;}
    else if(code==="too_large") statusMsg={kind:"err",text:"The museum is now too large to save. Remove a few photos or use smaller ones, then try again."};
    else if(code==="rate_limited") statusMsg={kind:"err",text:"Lots of saves in a row. Wait a minute, then try again."};
    else statusMsg={kind:"err",text:"The change didn’t save. Wait a moment and try again."};
    render();
  });
}
function clone(){return JSON.parse(JSON.stringify(data));}
function newId(){var s;do{s=Math.random().toString(36).slice(2,8);}while(data.items.some(function(i){return i.id===s;}));return s;}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}

/* ---------- router ---------- */
var app=document.getElementById("app"), speaking=false;
function render(){
  var h=(location.hash||"").replace(/^#/,""), html;
  try{ if(speaking){speechSynthesis.cancel();speaking=false;} }catch(e){}
  if(!h) html=viewHome();
  else if(GMAP[h]) html=viewGallery(GMAP[h]);
  else if(h.indexOf("item-")===0){var it=data.items.find(function(i){return i.id===h.slice(5);});html=it?viewItem(it):viewNotFound();}
  else if(h==="manage") html=viewHome();
  else html=viewHome();
  app.innerHTML=html;
  fitJourney();
}
function fitJourney(){
  try{ var nodes=app.querySelectorAll(".jnode"); if(!nodes.length) return;
    nodes.forEach(function(a){ var r=a.querySelector("rect"), w=parseFloat(r.getAttribute("width"))-28;
      a.querySelectorAll("text").forEach(function(t){ t.style.fontSize=""; var l=t.getComputedTextLength();
        if(l>w){ var fs=parseFloat(getComputedStyle(t).fontSize); t.style.fontSize=(fs*w/l).toFixed(1)+"px"; } }); });
  }catch(e){}
}
try{ if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitJourney); }catch(e){}
var lastHash=location.hash;
window.addEventListener("hashchange",function(){ if(location.hash!=="#manage"){editing=null;confirmDel=null;} if(location.hash!==lastHash){statusMsg=null;} lastHash=location.hash; render(); if(location.hash==="#gallery-list"){document.getElementById("gallery-list").scrollIntoView();}else window.scrollTo(0,0); });

app.addEventListener("click",function(e){
  var t=e.target.closest("button"); if(!t) return;
  var ds=t.dataset;
  if(t.id==="read-aloud"){ try{ if(speaking){speechSynthesis.cancel();speaking=false;t.textContent="Read this to me";return;}
      var it=data.items.find(function(i){return "#item-"+i.id===location.hash;}); if(!it) return;
      var u=new SpeechSynthesisUtterance([it.name,it.description,it.fact?"Did you know? "+it.fact:"",it.question?"Think about it. "+it.question:""].join(". "));
      u.rate=0.95; u.onend=function(){speaking=false;var b=document.getElementById("read-aloud");if(b)b.textContent="Read this to me";};
      speechSynthesis.speak(u); speaking=true; t.textContent="Stop reading"; }catch(err){} return; }
  if(ds.qrItem){var it2=data.items.find(function(i){return i.id===ds.qrItem;}); if(it2) saveQRImage(itemURL(it2),it2.name,"Scan to learn about this item · "+it2.no,(it2.no||"item")+"-qr.png",t); return;}
  if(ds.qrGallery){var g=GMAP[ds.qrGallery]; saveQRImage(galleryURL(g),g.title,"Scan to explore Gallery "+g.n,"gallery-"+g.n+"-"+g.id+"-qr.png",t); return;}
  if(ds.tab){staffTab=ds.tab;confirmDel=null;statusMsg=null;render();return;}
  if(ds["new"]){editing=blankItem();photoWork=null;statusMsg=null;render();return;}
  if(ds.edit){var src=data.items.find(function(i){return i.id===ds.edit;}); if(!src) return; editing=JSON.parse(JSON.stringify(src));photoWork=null;statusMsg=null;
    if(location.hash!=="#manage"){location.hash="manage";} else render(); return;}
  if(ds.cancel){editing=null;statusMsg=null;render();return;}
  if(ds.rmphoto){readForm();editing.photo="";render();return;}
  if(ds.del){confirmDel=ds.del;render();return;}
  if(ds.delno){confirmDel=null;render();return;}
  if(ds.delyes){var n=clone(),gone=n.items.find(function(i){return i.id===ds.delyes;});n.items=n.items.filter(function(i){return i.id!==ds.delyes;});confirmDel=null;save(n,"Deleted “"+(gone?gone.name:"item")+"”.");return;}
  if(ds.toggle){var n2=clone(),x=n2.items.find(function(i){return i.id===ds.toggle;}); if(!x) return; x.status=x.status==="display"?"coming":"display"; save(n2,"“"+x.name+"” is now "+(x.status==="display"?"on display":"marked coming soon")+".");return;}
});
app.addEventListener("change",function(e){
  if(e.target.id!=="f-photo"||!editing) return; var file=e.target.files&&e.target.files[0]; if(!file) return;
  readForm(); photoWork="Preparing photo…"; render();
  readPhoto(file).then(function(url){editing.photo=url;photoWork=null;render();}).catch(function(){photoWork="That photo couldn’t be read. Try a JPG or PNG file.";render();});
});
app.addEventListener("submit",function(e){
  if(e.target.id!=="item-form") return; e.preventDefault(); readForm();
  if(!editing.name){statusMsg={kind:"err",text:"Give the item a name before saving."};render();var f=document.getElementById("f-name");if(f)f.focus();return;}
  var n=clone(), it=editing;
  if(!it.id){ it.id=newId(); it.no="JM-"+String(n.nextNo||1).padStart(3,"0"); n.nextNo=(n.nextNo||1)+1; it.added=today(); n.items.push(it); }
  else { delete it.sample; n.items=n.items.map(function(i){return i.id===it.id?it:i;}); }
  save(n,(e.submitter&&false)||("Saved “"+it.name+"”."));
});

render();

})();
</script>
